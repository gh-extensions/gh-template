name: Auto Merge

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  merge:
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    steps:
      # The App's token, not github.token: GitHub runs no workflow for a push
      # made with github.token, so a merge by it ran no CI on main -- and no
      # release job, which left a merged release PR untagged. A workflow run
      # for a Dependabot PR gets no Actions secrets, so there it falls back to
      # github.token, merging as before.
      - name: Generate App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" || echo "PR approval skipped or failed."
          gh pr merge --auto --squash "$PR_URL"
